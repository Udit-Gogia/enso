# App
spring.application.name=enso-backend

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/enso?options=-c%20timezone%3DUTC}
spring.datasource.username=${DATABASE_USERNAME:myuser}
spring.datasource.password=${DATABASE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TimeZone='UTC'

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

# JWT
jwt.secret=${JWT_SECRET:enso-secret-key-that-is-long-enough-for-hmac-sha-256-algorithm}
jwt.expiration=86400000
jwt.setup-expiration=86400000

# Server
server.port=${PORT:8080}